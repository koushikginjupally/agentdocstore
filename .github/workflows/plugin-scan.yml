# HOL plugin scanner: checks for committed secrets, unpinned actions and
# broad permissions. Registries that list AgentDocStore (for example the HOL
# Plugin Registry) read this workflow as maintainer-owned scanner CI.
name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@20e083764dcb3ec83e266976f05c5e8ecb666129 # v1.2.715
        with:
          plugin_dir: '.'
          min_score: 80
          fail_on_severity: high
          pr_comment: 'off'
